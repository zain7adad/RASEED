function vOne(id,blur){const e=$(id),m=$('e_'+id);if(!e||!m)return;if(blur||m.textContent)setErr(id,RULES[id](e.value.trim()))}
function vAll(ids){let bad=null;ids.forEach(i=>{const msg=RULES[i]($(i).value.trim());setErr(i,msg);if(msg&&!bad)bad=i});if(bad)$(bad).focus();return !bad}

async function saveAlert(){const v=+$('at').value;if(!v)return;if(window.Notification&&Notification.permission=='default')await Notification.requestPermission();
const{data,error}=await sb.from('alerts').insert({metric:$('am').value,dir:$('ad').value,target:v}).select().single();if(error)return toast(t('fail')+error.message);A.push(data);closeSheet();render();toast(t('saved'))}

/* ===== auth ===== */
let mode='in';
function authView(){$('nav').innerHTML='';closeSheet();const su=mode=='up';$('app').innerHTML=`<div class="auth"><div class="lgs">${langSeg()}</div><div class="brand"><div class="mark">${ic('wallet',26)}</div><div><h1>RASEED · رصيد</h1></div></div><p class="mute" style="margin:0 0 18px">${t('tag')}</p>
<div class="card"><div class="seg"><button class="${!su?'on':''}" onclick="mode='in';authView()">${t('login')}</button><button class="${su?'on':''}" onclick="mode='up';authView()">${t('signup')}</button></div><div class="gen" id="gen"></div>
${su?fld('fn',t('name'),{r:1,attr:'autocomplete="name"'})+fld('fu',t('uname'),{r:1,oi:'chkU()',hint:t('uhint')})+fld('fe',t('email'),{r:1,type:'email',attr:'autocomplete="email"'})+fld('fp',t('pass'),{r:1,type:'password',attr:'autocomplete="new-password"'})+fld('fa',t('age'),{type:'number',attr:'inputmode="numeric"'})+fld('fh',t('phone'),{type:'tel',ph:'+9665XXXXXXXX'}):
fld('fi',t('idl'),{r:1,attr:'autocomplete="username"'})+fld('fq',t('pass'),{r:1,type:'password',attr:'autocomplete="current-password"'})}
<button id="ab" onclick="auth()">${su?t('signup'):t('login')}</button><div class="k" style="margin-top:10px"><i class="rq">*</i> ${t('req').slice(2)}</div>
<div class="or">${t('or')}</div><button class="alt" style="margin-top:6px" onclick="startGuest()">${t('gcont')}</button></div></div>`}
async function auth(){const su=mode=='up',b=$('ab'),g=$('gen');g.textContent='';if(!vAll(su?['fn','fu','fe','fp','fa','fh']:['fi','fq']))return;
const lock=x=>{b.disabled=x;b.textContent=x?'...':su?t('signup'):t('login')};lock(true);
try{let r;
if(su){const u=$('fu').value.trim().toLowerCase(),f=await sb.rpc('username_free',{u});if(!f.data){setErr('fu',t('taken'));$('fu').focus();return lock(false)}
r=await sb.auth.signUp({email:$('fe').value.trim(),password:$('fp').value,options:{data:{username:u,name:$('fn').value.trim(),age:$('fa').value.trim(),phone:$('fh').value.trim()}}})}
else{const id=$('fi').value.trim();let email=id;if(!id.includes('@')){const q=await sb.rpc('email_for_username',{u:id.toLowerCase()});if(!q.data){setErr('fi',t('nouser'));$('fi').focus();return lock(false)}email=q.data}
r=await sb.auth.signInWithPassword({email,password:$('fq').value});if(r.error&&r.error.message.toLowerCase().includes('invalid login')){if(!id.includes('@'))setErr('fq',t('wrongpw'));else g.textContent=t('badcred');return lock(false)}}
if(r.error){if(r.error.message.toLowerCase().includes('already')){setErr('fe',t('emailused'));$('fe').focus()}else g.textContent=mapErr(r.error.message);return lock(false)}
if(!r.data.session){g.textContent=t('confirm');return lock(false)}
user=r.data.session.user;guest=false;sessionStorage.removeItem('guest');boot()}catch(e){g.textContent=mapErr(e.message||String(e));lock(false)}}
function demo(){const d=new Date(),o=[],dt=(m,day)=>new Date(d.getFullYear(),d.getMonth()+m,day,12).toISOString().slice(0,10);
for(let i=5;i>=0;i--){o.push({id:'a'+i,kind:'income',date:dt(-i,1),amount:12000,category:'salary'},{id:'b'+i,kind:'expense',date:dt(-i,5),amount:2800+i*120,category:'housing'},{id:'c'+i,kind:'expense',date:dt(-i,12),amount:1400+i*90,category:'food'},{id:'d'+i,kind:'expense',date:dt(-i,20),amount:650,category:'transport'})}
o.push({id:'g1',kind:'gold',date:dt(-3,10),grams:10,price:430,amount:4300},{id:'g2',kind:'gold',date:dt(-1,8),grams:5,price:455,amount:2275});return o.sort((a,b)=>b.date.localeCompare(a.date))}
function startGuest(){guest=true;sessionStorage.setItem('guest','1');E=demo();A=[];PF={name:t('guest'),username:'guest'};render();refreshPrice()}
function leaveGuest(m){guest=false;sessionStorage.removeItem('guest');E=[];A=[];PF=null;mode=m;authView()}
async function logout(){await sb.auth.signOut();user=null;E=[];A=[];PF=null;authView()}
async function boot(){try{await load()}catch(x){toast(t('fail')+(x.message||x))}render();refreshPrice()}
(async()=>{try{sb=supabase.createClient(CFG.url,CFG.key);user=(await sb.auth.getSession()).data.session?.user||null}catch(e){}
const h=location.hash.slice(1);if(TABS.includes(h))tab=h;
if(user)boot();else if(sessionStorage.getItem('guest'))startGuest();else authView();
setInterval(()=>{if(!document.hidden)refreshPrice()},10000);refreshPrice();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
